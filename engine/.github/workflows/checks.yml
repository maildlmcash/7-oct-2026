# Configured checks:
#   pnpm typecheck
#   web package command: next typegen && tsc --noEmit --incremental false
#   pnpm health
#   command: node scripts/health-smoke.mjs
#
# Missing checks. They are not configured and are not reported as passing:
#   formatter — no formatter package and no format script
#   linter — no linter package and no lint script
#   unit tests — no test runner and no unit tests

name: checks

on:
  push:
  pull_request:

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  health:
    name: health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Health smoke
        run: node scripts/health-smoke.mjs
